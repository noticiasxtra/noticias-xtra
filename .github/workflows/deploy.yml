# Builds the site and publishes it to GitHub Pages every time something lands on main.
# (Settings > Pages > Source must be set to "GitHub Actions".)
name: Publicar sitio

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *" # every hour, so the red bar and "Hace X horas" stay current
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build, and upload site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
