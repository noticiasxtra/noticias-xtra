# Twice a day: the AI checks the sources in scripts/sources.json, drafts new stories,
# and opens a pull request. An editor reviews it and clicks Merge to publish.
#
# Setup (one time):
#  1. Settings > Secrets and variables > Actions > New repository secret: ANTHROPIC_API_KEY
#  2. Settings > Actions > General > Workflow permissions: check
#     "Allow GitHub Actions to create and approve pull requests"
#  3. Optional repository variables: ANTHROPIC_MODEL, MAX_ARTICLES
name: Noticias con IA

on:
  schedule:
    - cron: "0 11,21 * * *"   # 7:00 a.m. and 5:00 p.m. Puerto Rico time
  workflow_dispatch:           # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find sources and draft stories
        id: fetch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          MAX_ARTICLES: ${{ vars.MAX_ARTICLES }}
        run: node scripts/fetch-news.mjs

      - name: Save progress and open a pull request for editor review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ steps.fetch.outputs.count }}
        run: |
          git config user.name "noticias-xtra-ia"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 1) Remember which source items were already checked (goes straight to main)
          if ! git diff --quiet scripts/seen.json; then
            git add scripts/seen.json
            git commit -m "IA: actualizar fuentes revisadas"
            git push origin HEAD:main
          fi

          # 2) New stories go to a separate branch + pull request for the editor
          if [ "$COUNT" != "0" ]; then
            BRANCH="ia/noticias-$(date -u +%Y%m%d-%H%M)"
            git checkout -b "$BRANCH"
            git add src/content/noticias
            git commit -m "IA: $COUNT noticias para revisión"
            git push origin "$BRANCH"
            gh pr create --base main --head "$BRANCH" \
              --title "Noticias para revisar: $COUNT ($(TZ=America/Puerto_Rico date +'%d/%m %I:%M %p'))" \
              --body-file pr-body.md
          fi
