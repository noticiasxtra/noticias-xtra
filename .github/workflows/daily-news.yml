# Every 2 hours from 6 a.m. to 10 p.m. (Puerto Rico): the AI checks the sources in scripts/sources.json and drafts new stories.
# Each source has a review level ("review" in sources.json):
#   auto / check -> published right away; "check" stories are also listed in an issue for a quick look
#   always       -> saved hidden (draft + pending) for an editor to approve in the panel (Noticias → Por aprobar):
#                   political, legal, crime, sensitive, low confidence. An issue tells the reviewer they're waiting.
# The reviewer (REVIEWER below) is assigned to both, so GitHub sends an email and a phone notification.
#
# Setup (one time):
#  1. Settings > Secrets and variables > Actions > New repository secret: ANTHROPIC_API_KEY
#  2. Optional repository variables: ANTHROPIC_MODEL, MAX_ARTICLES, REVIEWER
name: Noticias con IA

on:
  schedule:
    - cron: "0 10,12,14,16,18,20,22,0,2 * * *"   # 6 a.m. to 10 p.m. Puerto Rico time, every 2 hours (NotiCel publishes all day)
  workflow_dispatch:           # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write
  issues: write
  actions: write # to start the site rebuild right after publishing

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find sources and draft stories
        id: fetch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          MAX_ARTICLES: ${{ vars.MAX_ARTICLES }}
        run: node scripts/fetch-news.mjs

      - name: Publish, open the review pull request and the quick-look issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ steps.fetch.outputs.count }}
          REVIEW: ${{ steps.fetch.outputs.review }}
          CHECK: ${{ steps.fetch.outputs.check }}
          AUTO: ${{ steps.fetch.outputs.auto }}
          # The person notified (an organization can't be assigned): repository variable REVIEWER, or the publisher's account
          REVIEWER: ${{ vars.REVIEWER || 'publisher-noticiasxtra' }}
        run: |
          git config user.name "noticias-xtra-ia"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WHEN="$(TZ=America/Puerto_Rico date +'%d/%m %I:%M %p')"

          # 1) Checked sources and every new story go straight to main (the ones that need approval stay hidden)
          git add scripts/seen.json scripts/pending.json
          if [ "${AUTO:-0}" != "0" ]; then xargs -a ai-auto.txt git add --; fi
          if ! git diff --cached --quiet; then
            git commit -m "IA: ${AUTO:-0} noticias publicadas y fuentes revisadas"
            # Someone may have published (panel, another change) while the AI was writing: catch up first
            git pull --rebase origin main
            git push origin HEAD:main
            # Pushes made with GITHUB_TOKEN don't start other workflows, so start the rebuild directly
            if [ "${AUTO:-0}" != "0" ]; then gh workflow run deploy.yml --ref main; fi
          fi

          # 2) Routine stories already published: an issue for a quick look
          if [ "${CHECK:-0}" != "0" ]; then
            URL=$(gh issue create --title "Vistazo rápido: $CHECK publicadas ($WHEN)" --body-file check-body.md)
            gh issue edit "$URL" --add-assignee "$REVIEWER" || echo "No se pudo asignar a $REVIEWER (el aviso sí se creó)"
          fi

          # 3) Stories waiting for approval in the panel: an issue so the reviewer gets an email
          if [ "${REVIEW:-0}" != "0" ]; then
            URL=$(gh issue create --title "Noticias para aprobar: $REVIEW ($WHEN)" --body-file pr-body.md)
            gh issue edit "$URL" --add-assignee "$REVIEWER" || echo "No se pudo asignar a $REVIEWER (el aviso sí se creó)"
          fi
