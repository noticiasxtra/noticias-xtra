# One-time check of the sports data account (Highlightly): which Puerto Rico leagues it has and with what ids.
# Run it from Actions → "Marcadores: revisar ligas" → Run workflow. It saves scripts/sports-discovery.json.
name: "Marcadores: revisar ligas"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ask Highlightly which leagues it has
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
        run: node scripts/sports-discover.mjs
      - name: Save the answer
        run: |
          git config user.name "noticias-xtra-ia"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sports-discovery.json
          git commit -m "Marcadores: ligas disponibles en Highlightly" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
