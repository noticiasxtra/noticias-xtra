<svg xmlns="http://www.w3.org/2000/svg" width="300" height="600" viewBox="0 0 300 600"><style>
.steam{animation:rise 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.s2{animation-delay:.9s}.s3{animation-delay:1.7s}
@keyframes rise{0%{opacity:0;transform:translateY(8px) scaleY(.7)}40%{opacity:.85}100%{opacity:0;transform:translateY(-16px) scaleY(1.15)}}
.in1{animation:slide 6s ease infinite}.in2{animation:slide 6s ease .35s infinite}.in3{animation:slide 6s ease .7s infinite}
@keyframes slide{0%{opacity:0;transform:translateX(-14px)}10%,88%{opacity:1;transform:none}100%{opacity:0}}
.cta{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.06)}}
.shine{animation:shine 3.5s ease-in-out infinite}
@keyframes shine{0%,60%{transform:translateX(-120px)}100%{transform:translateX(520px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style><rect width="300" height="600" fill="#2A1A12"/><rect class="shine" x="0" y="0" width="60" height="600" fill="#fff" opacity=".06" transform="skewX(-20)"/><g transform="translate(84 150) scale(1.9)">
<path class="steam" d="M22 18c-6-8 6-12 0-20" fill="none" stroke="#FFF3E2" stroke-width="3" stroke-linecap="round" opacity="0"/>
<path class="steam s2" d="M36 18c-6-8 6-12 0-20" fill="none" stroke="#FFF3E2" stroke-width="3" stroke-linecap="round" opacity="0"/>
<path class="steam s3" d="M50 18c-6-8 6-12 0-20" fill="none" stroke="#FFF3E2" stroke-width="3" stroke-linecap="round" opacity="0"/>
<path d="M8 26h56l-6 40a10 10 0 0 1-10 8H24a10 10 0 0 1-10-8z" fill="#F2B54A"/>
<path d="M64 34h6a10 10 0 0 1 0 20h-8" fill="none" stroke="#F2B54A" stroke-width="6"/>
<rect x="2" y="76" width="74" height="6" rx="3" fill="#FFF3E2" opacity=".85"/>
</g>
<text class="in1" x="150" y="380" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#FFF3E2" text-anchor="middle">Café del Barrio</text>
<text class="in2" x="150" y="418" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#FFF3E2" opacity=".9" text-anchor="middle">Colao fresco, como</text>
<text class="in2" x="150" y="442" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#FFF3E2" opacity=".9" text-anchor="middle">en casa de abuela</text>
